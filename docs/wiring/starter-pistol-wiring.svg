<text x="40" y="858" font-size="11" text-anchor="start" fill="#546e7a" dominant-baseline="central">All GND pins are common. INMP441 L/R is tied to GND (left channel).</text>
<text x="40" y="875" font-size="11" text-anchor="start" fill="#546e7a" dominant-baseline="central">“ARDUINO BOARD” in the routing table is the NodeMCU ESP-12E; D5/D6/D7 are the ESP8266 hardware I²S RX pins (WS/SD/SCK).</text>
<text x="40" y="892" font-size="11" text-anchor="start" fill="#546e7a" dominant-baseline="central">Edit in diagrams.net / draw.io (File → Open). Wires are attached to the pin dots, so move parts and the wires follow.</text>
